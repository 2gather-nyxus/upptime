  incidentCompleted: Terminee
  incidentScheduled: Planifiee
  duration24H: 24 h
  duration7D: 7 j
  duration30D: 30 j
  duration1Y: 1 an
  durationAll: tout
  errorTitle: Une erreur est survenue
  errorIntro: Impossible de recuperer l'etat le plus recent des services.
  errorText: Reessayez dans quelques instants.
  errorHome: Revenir a l'accueil
