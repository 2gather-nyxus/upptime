  incidentCommentSummary: Publie le $DATE par $AUTHOR
  incidentBack: Retour a tous les incidents
  pastIncidents: Incidents passes
  pastIncidentsResolved: "Resolu en $MINUTES minutes, $POSTS message(s)"
  liveStatus: Etat en direct
  overallUptime: "Disponibilite globale : $UPTIME"
  overallUptimeTitle: Disponibilite globale
  averageResponseTime: "Temps de reponse moyen : $TIME ms"
  averageResponseTimeTitle: Temps de reponse moyen
  sevelDayResponseTime: Temps de reponse sur 7 jours
  responseTimeMs: Temps de reponse (ms)
