owner: 2gather-nyxus
repo: upptime

# Liste blanche explicite des secrets passes aux workflows. Sans cette cle,
# Upptime bascule en mode automatique et expose un contexte de secrets bien
# plus large que necessaire. Ajouter ici le nom de tout nouveau secret,
# y compris les cles NOTIFICATION_* le jour ou une alerte temps reel est
# branchee : quand `secrets` est present, c'est la liste complete.
secrets:
  - API_EVENTS_URL
  - ADMIN_APP_URL
  - ADMIN_EVENTS_URL
  - ADMIN_ME_URL

sites:
  # Deux sondes sur l'API, et c'est deliberé. La premiere repond sans toucher
  # ni la base ni le cache : elle reste verte quand PostgreSQL est tombe. La
  # seconde lit reellement la base. Les deux ensemble distinguent un processus
  # mort d'une base morte.
  #
  # Seule la sonde de vie affiche son adresse : elle ne rend qu'un statut et un
  # horodatage. La sonde de lecture passe par un secret, parce que la publier
  # reviendrait a indexer, depuis une page suivie par les robots, un point
  # d'entree qui rend des donnees. Elle est bornee a un enregistrement : ce qui
  # est verifie, c'est que la lecture aboutit, pas le volume rendu.
  - name: API
    url: https://api.2-gather.app/api/health
    maxResponseTime: 2000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: API, acces base de donnees
    url: $API_EVENTS_URL
    maxResponseTime: 2000
    __dangerous__body_down_if_text_missing: "pagination"

  - name: Application web evenements
    url: https://2gather.events
    maxResponseTime: 3000
  - name: Application web profils
    url: https://2gather.me
    maxResponseTime: 3000

  # Les trois consoles d'administration sont surveillees par URL secrete.
  # L'etat est public, l'adresse ne l'est pas : Upptime ecrit le nom du
  # secret dans history/ et n'affiche aucun lien sur la page de statut.
  #
  # Le seuil de la console evenements est plus large que les autres parce que
  # le chemin runner vers origine y est mesurablement plus lent, 1605 et
  # 2270 ms releves contre 490 a 590 ms ailleurs. Lui appliquer le seuil
  # commun produirait un degrade permanent qui ne signalerait rien.
  - name: Administration, production
    url: $ADMIN_APP_URL
    maxResponseTime: 2000
  - name: Administration, evenements
    url: $ADMIN_EVENTS_URL
    maxResponseTime: 4000
  - name: Administration, profils
    url: $ADMIN_ME_URL
    maxResponseTime: 2000

status-website:
  baseUrl: /upptime
  name: Etat des services 2gather
  introTitle: Etat des services 2gather
  introMessage: >-
    Disponibilite des services 2gather, relevee toutes les cinq minutes depuis
    les runners GitHub Actions. Chaque mesure est ajoutee a l'historique public
    du depot. Une interruption ouvre une issue datee, close au retablissement.

  # Theme aux couleurs de la marque, servi depuis assets/. Tout fichier de ce
  # repertoire est publie tel quel a la racine du site.
  themeUrl: https://2gather-nyxus.github.io/upptime/2gather.css

  logoUrl: https://2gather.events/icon.png
  favicon: https://2gather.events/favicon.ico

  navbar:
    - title: Etat
      href: /
    - title: Historique des relevés
      href: https://github.com/2gather-nyxus/upptime/commits/main
    - title: 2gather.events
      href: https://2gather.events
    - title: 2gather.me
      href: https://2gather.me

  # Sans ces balises, un lien partage vers la page de statut s'affiche nu.
  # C'est le seul endroit ou la page est vue par quelqu'un qui ne l'a pas
  # demandee, donc c'est celui qui compte le plus.
  metaTags:
    - name: description
      content: Etat en temps reel des services 2gather, releve toutes les cinq minutes.
    - name: theme-color
      content: "#faf4e9"
    - property: "og:title"
      content: Etat des services 2gather
    - property: "og:description"
      content: Etat en temps reel des services 2gather, releve toutes les cinq minutes.
    - property: "og:type"
      content: website
    - property: "og:url"
      content: https://2gather-nyxus.github.io/upptime/
    - property: "og:image"
      content: https://2gather.events/2gather/og.png
    - name: "twitter:card"
      content: summary_large_image

