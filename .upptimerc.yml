    est epuise.
  rateLimitExceededErrorHowCanFix: Comment y remedier ?
  rateLimitExceededErrorFix: >-
    Le quota de votre adresse IP se retablit au bout d'une heure. Vous pouvez
    aussi renseigner un jeton d'acces personnel GitHub, qui porte la limite a
    5 000 requetes par heure.
  rateLimitExceededGeneratePAT: Comment generer un jeton d'acces personnel
