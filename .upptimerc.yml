  rateLimitExceededRemoveToken: Retirer le jeton
  rateLimitExceededGitHubPAT: Jeton d'acces personnel GitHub
  rateLimitExceededCopyPastePAT: Collez votre jeton ici
  rateLimitExceededSaveToken: Enregistrer le jeton

# Seul `uptime` porte une contrainte reelle : c'est la frequence de mesure.
# Les autres taches ne font que reconstruire des vues a partir de l'historique.
# `updateTemplate` et `updates` sont declenches a la main, voir README.
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 */6 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

# Par defaut Upptime supprime les issues d'incident refermees en moins de
# quinze minutes. La plupart des pannes durent moins que ca : sans ce reglage,
# l'historique des incidents perd precisement les cas les plus frequents.
skipDeleteIssues: true

assignees:
  - Asteerix

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
