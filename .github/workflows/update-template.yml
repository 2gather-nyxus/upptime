# Declenchement manuel seulement. Cette tache reecrit les fichiers de workflow,
# ce que le jeton natif des Actions n'a pas le droit de faire. Elle exige un
# secret GH_PAT a portee fine avec droit d'ecriture sur Contents et Workflows.
# Planifiee, elle echouerait chaque nuit sans rien signaler de reel.
name: Update Template CI
on:
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@v1.43.14
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
