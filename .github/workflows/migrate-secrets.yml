name: Migrate secrets
on:
  workflow_dispatch:
permissions: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TARGET_TOKEN }}
      TARGET: 2gather-platform/2gather-status
    steps:
      - name: Copy every secret of this repository into the target repository
        env:
          S_ADMIN_APP_URL: ${{ secrets.ADMIN_APP_URL }}
          S_ADMIN_EVENTS_URL: ${{ secrets.ADMIN_EVENTS_URL }}
          S_ADMIN_ME_URL: ${{ secrets.ADMIN_ME_URL }}
          S_API_EVENTS_URL: ${{ secrets.API_EVENTS_URL }}
        run: |
          set -euo pipefail
          for name in ADMIN_APP_URL ADMIN_EVENTS_URL ADMIN_ME_URL API_EVENTS_URL; do
            var="S_$name"
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "$name: empty here, skipped"
              continue
            fi
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET"
            echo "$name: copied"
          done
